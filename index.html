<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: pink;
      font-family: Arial, sans-serif;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    button {
      margin-top: 10px;
      padding: 10px 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Valentine’s Day ❤</h1>
    <p id="msg">You are special 💕</p>
    <button onclick="change()">Click me</button>
  </div>

  <script>
    function change() {
      document.getElementById("msg").innerText = "I love you 💖";
    }
  </script>

</body>
</html>

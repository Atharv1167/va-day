<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentine’s Day Shonnaa ❤</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 350px;
      width: 90%;
      z-index: 2;
      animation: fadeIn 2s ease;
    }
    h1 {
      color: #e63946;
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      font-size: 16px;
      color: #333;
      line-height: 1.6;
    }
    img {
      width: 100%;
      border-radius: 15px;
      margin: 15px 0;
    }
    .heart {
      font-size: 45px;
      color: #e63946;
      animation: beat 1s infinite;
      margin: 10px 0;
    }
    button {
      background: #e63946;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .falling-heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      animation: fall linear infinite;
      top: -10%;
    }
